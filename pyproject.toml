[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "parley"
version = "0.1.0"
description = "Open-source real-time voice framework for game NPCs: streaming ASR->LLM->TTS, character cards, and an automated persona fine-tuning pipeline."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["game", "npc", "voice", "llm", "tts", "asr", "streaming"]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Real backends are opt-in so the core runtime stays light and the whole
# pipeline can be developed/tested with mock backends on any machine.
asr = ["faster-whisper>=1.0"]
tts = ["kokoro>=0.9", "soundfile>=0.12"]
vad = ["silero-vad>=5.1"]
dev = ["pytest>=8.0", "websockets>=12"]

[project.scripts]
parley = "parley.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/parley"]

[tool.pytest.ini_options]
testpaths = ["tests"]
